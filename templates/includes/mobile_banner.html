<!-- Banner responsivo com ilustração do acesso pelo celular. -->
<section class="app-banner section-block" aria-labelledby="app-titulo">
  <div class="phone-mockup" aria-hidden="true">
    <div class="phone-island"></div>
    <span class="phone-brand">FOM<span>O</span></span>
    <div class="phone-photo"></div>
    <span class="phone-title">
      Grandes
      <br>
      momentos.
      <br>
      <em>Com você.</em>
    </span>
    <div class="phone-bottom">
      ⌂ <span>♡</span> ▦
    </div>
  </div>
  <div class="app-copy">
    <p class="eyebrow">Sua experiência, mais perto</p>
    <h2 id="app-titulo">
      Seus eventos favoritos,
      <br>
      <span class="text-gradient">na palma da mão.</span>
    </h2>
    <p>
      O FOMO acompanha seu ritmo. Explore pelo celular
      <br class="d-none d-lg-block">
      e prepare-se para viver novas histórias.
    </p>
    <span class="status-pill">Feito para o seu celular</span>
  </div>
  <div class="app-visual" aria-hidden="true">
    <div class="visual-ring"></div>
    <div class="floating-ticket">
      <span>FOMO</span>
      <span class="ticket-line"></span>
      <strong>VIVA
        <br>
      O AGORA.</strong>
      {% include "includes/icon.html" with name="ticket" %}
    </div>
  </div>
</section>
